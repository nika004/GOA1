<!-- 1) Sololearn შეასრულეთ The Box Model სექციის ჩათვლით (Introduction to CSS)

2) ახსენით რა არის CSS Box Model და შექმენით თქვენი ნახაზი
box model-ი  არის მოდელი რომელიც აჩვენებს თუ როგორ მუშაობს მარგინი და პადინგი
    მარგინი გვეხმარება შევქმნათ ადგილი ელემტებს შორიდს ბორდერის გარეთ
    პედინგი გვეხმარება შევქმნათ ადგილი ბორდერის შიგნით
    ბორდერი ქმნის ბორდერს ელემენტის ირგვლივ

3) დაწერეთ როგორ მუშაობს padding და margin, ჩამოთვალეთ CSS Box Model-ის ყველა შრე. ასევე CSS-ში დაწერეთ CSS reset-ის კოდი და ახსენით რისთვის ვიყენებთ
        პედინგი გვეხმარება შევქმნათ ადგილი ბორდერის შიგნით
        ბორდერი ქმნის ბორდერს ელემენტის ირგვლივ

        content,padding,border,margin არის box modelis ნაწილები
        reset css ვიყენებთ რომ მინიჭებული ზომები  გავანულოთ


4) შექმენით 5 div ბლოკი, გაუწერეთ სხვადასხვა კუთვნილებები, აუცილებლად მიანიჭეთ ყველას margin და padding, გატესტეთ სხვადასხვა ვარიანტები

5) შექმენით div ელემენტი id="container". მას მიანიჭეთ width და height მნიშვნელობები, მაგალითად 300px და 200px, ასევე background-color.

შემდეგ ამ ელემენტს გაუწერეთ შემდეგი თვისებები:
- padding: 20px;
- border: 5px solid black;
- margin: 30px;

დამატეთ კომენტარები კოდის თავზე ან შიგნით, სადაც განმარტავთ:
- რა არის padding
- რა არის border
- რა არის margin
- რა არის content

ასევე მიუთითეთ, როგორ მუშაობს მთლიანობაში Box Model.
